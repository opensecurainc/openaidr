name: App

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install build tools
        run: |
          corepack enable
          rustup update stable --no-self-update
          rustup default stable
          python -m pip install --no-index --no-deps dependencies/api-runtime/*.whl
          python -m pip install -e '.[desktop]'
      - name: Build macOS app with ad hoc signing
        if: runner.os == 'macOS'
        run: python scripts/build_desktop.py --signing-mode ad-hoc
      - name: Build unsigned Windows or Linux app
        if: runner.os != 'macOS'
        run: python scripts/build_desktop.py
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openaidr-app-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0

  install-windows:
    name: Install Windows EXE
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openaidr-app-windows-x64-${{ github.sha }}
          path: build/install-artifacts
      - name: Install, launch, and uninstall the EXE
        shell: pwsh
        run: ./scripts/test_windows_install.ps1 -Artifacts build/install-artifacts -Output build/install-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-install-results
          path: build/install-results

  install-linux:
    name: Install Linux ${{ matrix.image }} ${{ matrix.format }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
        format: [deb, appimage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openaidr-app-linux-x64-${{ github.sha }}
          path: build/install-artifacts
      - name: Install, launch, and remove the Linux package
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p build/install-results
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/build/install-results:/results" \
            "$TEST_IMAGE" bash /source/scripts/test_linux_install.sh /source/build/install-artifacts /results "$TEST_FORMAT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-install-${{ strategy.job-index }}
          path: build/install-results
