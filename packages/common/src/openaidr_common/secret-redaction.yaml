# Credential redaction rules. See docs/telemetry.md for the rule schema.
# Additional formats adapted from Gitleaks (MIT), config/gitleaks.toml at:
# https://github.com/gitleaks/gitleaks/tree/b58d3f102cf3a2c84cb7f923d05c25c9b1aed84b
# See secret-redaction.LICENSE for attribution and adaptation notes.
secret_key_pattern: (^|[._-])(password|passwd|secret|token|api_key|apikey|authorization|credential|private_key)([._-]|$)
patterns:
  - name: cowork-connection-token
    pattern: (?<![A-Za-z0-9_-])oacw_[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])
    keywords:
      - oacw_
  - name: webhook-signing-secret
    pattern: (?<![A-Za-z0-9_-])whsec_[A-Za-z0-9+/]{22,}={0,2}(?![A-Za-z0-9+/=])
    keywords:
      - whsec_
  - name: private-key
    pattern: >-
      -----BEGIN [A-Z ]*PRIVATE KEY(?: BLOCK)?-----[\s\S]*?(?:-----END [A-Z ]*PRIVATE KEY(?: BLOCK)?-----|$)
    keywords:
      - private key
  - name: aws-access-key
    pattern: >-
      \b(?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA)[0-9A-Z]{16}\b
    keywords:
      - akia
      - asia
      - agpa
      - aida
      - aroa
      - anpa
  - name: github-token
    pattern: >-
      \b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b|\bgithub_pat_[A-Za-z0-9_]{22,}\b
    keywords:
      - ghp_
      - gho_
      - ghu_
      - ghs_
      - ghr_
      - github_pat_
  - name: gitlab-token
    pattern: >-
      \bglpat-[A-Za-z0-9_\-]{20,}(?![A-Za-z0-9_-])
    keywords:
      - glpat-
  - name: slack-token
    pattern: >-
      \bxox[abprs]-[A-Za-z0-9\-]{10,}(?![A-Za-z0-9_-])
    keywords:
      - xox
  - name: google-api-key
    pattern: >-
      \bAIza[0-9A-Za-z_\-]{35}(?![A-Za-z0-9_-])
    keywords:
      - aiza
  - name: anthropic-key
    pattern: >-
      \bsk-ant-[A-Za-z0-9_\-]{20,}(?![A-Za-z0-9_-])
    keywords:
      - sk-ant-
  - name: openai-key
    pattern: >-
      \bsk-(?:proj-)?[A-Za-z0-9_\-]{32,}(?![A-Za-z0-9_-])
    keywords:
      - sk-
  - name: openaidr-gateway-token
    pattern: >-
      (?<![A-Za-z0-9_-])oagt_[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])
    keywords:
      - oagt_
  - name: stripe-key
    pattern: >-
      \b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b
    keywords:
      - sk_live_
      - sk_test_
      - rk_live_
      - rk_test_
  - name: 1password-secret-key
    pattern: (?<![A-Za-z0-9_-])(?:A3-[A-Z0-9]{6}-(?:[A-Z0-9]{11}|[A-Z0-9]{6}-[A-Z0-9]{5})-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5})(?![A-Za-z0-9_-])
