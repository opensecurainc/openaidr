[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidr"
version = "0.1.0"
description = "OpenSecura Python SDK for dependency vulnerability scans and AI guardrail assessments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "anyio>=4,<5", "pydantic>=2.7,<3", "PyYAML>=6,<7", "tzdata; sys_platform == 'win32'"]
authors = [{name = "OpenSecura", email = "contact@opensecura.ai"}]
keywords = ["ai-agents", "guardrails", "security", "claude-code", "codex", "cursor", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://opensecura.ai/"
Repository = "https://github.com/opensecurainc/openaidr"
Issues = "https://github.com/opensecurainc/openaidr/issues"

[project.scripts]
aidr = "aidr:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.LICENSE", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
