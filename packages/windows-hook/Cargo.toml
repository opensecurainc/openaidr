[package]
name = "openaidr-hook"
publish = false
edition = "2021"
rust-version = "1.88"

[dependencies]
serde_json = "1"
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Threading", "Win32_System_Com"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
