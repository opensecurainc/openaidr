[build-system]
requires = ["setuptools>=77", "wheel", "tzdata"]
build-backend = "setuptools.build_meta"

[project]
name = "openaidr"
dynamic = ["version"]
description = "Agentic AI Detection and Response"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openaidr-api-client==2026.11.4+376d40c", "openaidr-common>=2026.10.28", "fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1", "psycopg[binary,pool]>=3.2,<4", "bcrypt>=4,<6", "PyYAML>=6,<7", "httpx>=0.27,<1", "opentelemetry-proto>=1.30,<2", "googleapis-common-protos>=1.63,<2", "tomlkit>=0.13,<1", "psutil>=7.2,<8", "tzdata"]

[project.optional-dependencies]
api-tests = ["openaidr-api==2026.11.4+376d40c"]
server = ["Authlib>=1.8,<1.9", "httpx2>=2.13,<3", "joserfc>=1.6.1,<2", "cryptography>=45.0.1,<51", "pypdf>=6.19,<7", "python-docx>=1.2,<2", "mcp>=2.3,<3", "uritemplate>=4.2,<5"]
desktop = ["pyinstaller>=6,<7", "openaidr[device]", "osquery==3.1.1"]
device = ["cryptography>=45.0.1,<51", "zstandard>=0.23,<1"]
broker = ["grpcio>=1.78,<2", "protobuf>=6.31.1,<8"]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "build>=1,<2", "ruff>=0.11,<1", "openaidr[server,device,broker]"]

[project.scripts]
openaidr-server = "openaidr.server.cli:main"
openaidr = "openaidr.sensor.cli:main"
openaidr-sensor = "openaidr.sensor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["openaidr", "openaidr.*"]
namespaces = false

[tool.setuptools.package-data]
openaidr = ["_build.json", "server/migrations/*.sql", "server/_dex/LICENSE", "server/_dex/api.proto", "core/gateway-plugins.json", "sensor/hook_opencode.js", "sensor/local_runtime_source.tar.gz", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
